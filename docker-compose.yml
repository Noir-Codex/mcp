version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - MCP_SERVER_PORT=8000
      - MCP_SERVER_HOST=0.0.0.0
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_MODEL=${EVOLUTION_MODEL}
      - BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL}
      - BITRIX24_ENABLED=${BITRIX24_ENABLED}
      - BITRIX24_ASSIGNED_BY_ID=${BITRIX24_ASSIGNED_BY_ID}
      - BITRIX24_PIPELINE_ID=${BITRIX24_PIPELINE_ID}
    volumes:
      - ./warehouse.db:/app/warehouse.db
      - ./logs:/var/log/mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - mcp-server
    environment:
      - LOG_LEVEL=INFO
      - MCP_SERVER_URL=http://mcp-server:8000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_MODEL=${EVOLUTION_MODEL}
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  mcp-data:
  mcp-logs: